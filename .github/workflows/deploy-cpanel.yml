name: Déployer sur cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer l’application Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration de déploiement
        id: config
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          if [[ -n "$CPANEL_HOST" && -n "$CPANEL_USER" && -n "$CPANEL_SSH_PRIVATE_KEY" && -n "$CPANEL_KNOWN_HOSTS" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Déploiement ignoré : ajoutez les secrets CPANEL_HOST, CPANEL_USER, CPANEL_SSH_PRIVATE_KEY et CPANEL_KNOWN_HOSTS dans GitHub." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Vérifier les tests et les dépendances
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Configurer la connexion SSH
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          host_key_alias=""
          first_known_host="$(printf '%s\n' "$CPANEL_KNOWN_HOSTS" | awk 'NF >= 3 && $1 !~ /^#/ && $2 ~ /^(ssh-|ecdsa-|sk-)/ && $3 ~ /^[A-Za-z0-9+/]+={0,2}$/ { print $1; exit }')"
          expected_fingerprint="$(printf '%s\n' "$CPANEL_KNOWN_HOSTS" | grep -oE 'SHA256:[A-Za-z0-9+/]+={0,2}' | head -n 1 || true)"
          expected_public_key="$(printf '%s\n' "$CPANEL_KNOWN_HOSTS" | awk 'NF >= 2 && $1 ~ /^(ssh-|ecdsa-|sk-)/ && $2 ~ /^[A-Za-z0-9+/]+={0,2}$/ { print $1 " " $2; exit }')"
          if [[ -n "$first_known_host" ]]; then
            printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
            host_key_alias="$first_known_host"
            if [[ "$host_key_alias" == \|1\|* ]]; then
              host_key_alias="$CPANEL_HOST"
            fi
          else
            if [[ -z "$expected_fingerprint" && -z "$expected_public_key" ]]; then
              echo "CPANEL_KNOWN_HOSTS doit contenir une entrée known_hosts, une empreinte SHA256 ou une clé publique SSH." >&2
              exit 1
            fi
            scan_file="$(mktemp)"
            ssh-keyscan -T 10 -p "${CPANEL_SSH_PORT:-22}" "$CPANEL_HOST" > "$scan_file" 2>/dev/null || true
            if [[ -n "$expected_fingerprint" ]]; then
              key_matches="$(ssh-keygen -E sha256 -lf "$scan_file" 2>/dev/null | awk -v expected="$expected_fingerprint" '$2 == expected { found = 1 } END { print found + 0 }')"
            else
              key_matches="$(awk -v expected="$expected_public_key" '$2 " " $3 == expected { found = 1 } END { print found + 0 }' "$scan_file")"
            fi
            if [[ "$key_matches" != 1 ]]; then
              rm -f "$scan_file"
              echo "La clé ou l’empreinte de CPANEL_KNOWN_HOSTS ne correspond pas au serveur." >&2
              exit 1
            fi
            cp "$scan_file" ~/.ssh/known_hosts
            host_key_alias="$(awk 'NF >= 3 && $1 !~ /^#/ { print $1; exit }' ~/.ssh/known_hosts)"
            rm -f "$scan_file"
          fi
          chmod 600 ~/.ssh/known_hosts
          if [[ ! "$host_key_alias" =~ ^[A-Za-z0-9.-]+$ && ! "$host_key_alias" =~ ^\[[A-Za-z0-9.-]+\]:[0-9]+$ ]]; then
            host_key_alias="$CPANEL_HOST"
          fi
          if [[ ! "$CPANEL_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "CPANEL_HOST ne contient pas un nom d’hôte valide." >&2
            exit 1
          fi
          echo "CPANEL_HOST_KEY_ALIAS=$host_key_alias" >> "$GITHUB_ENV"
          echo "CPANEL_SSH_PORT=${CPANEL_SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Synchroniser les fichiers de l’application
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail
          if [[ ! "$CPANEL_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "CPANEL_USER ne contient pas un nom d’utilisateur valide." >&2
            exit 1
          fi
          deploy_dir="/home/$CPANEL_USER/patricialanctot-app"
          ssh -i ~/.ssh/cpanel_deploy_key -p "${CPANEL_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o "HostKeyAlias=$CPANEL_HOST_KEY_ALIAS" "$CPANEL_USER@$CPANEL_HOST" \
            "mkdir -p '$deploy_dir' && command -v rsync >/dev/null"
          rsync -az \
            -e "ssh -i ~/.ssh/cpanel_deploy_key -p ${CPANEL_SSH_PORT:-22} -o IdentitiesOnly=yes -o HostKeyAlias=${CPANEL_HOST_KEY_ALIAS}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='server/data/' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-shm' \
            --exclude='*.sqlite-wal' \
            --exclude='*.zip' \
            ./ "$CPANEL_USER@$CPANEL_HOST:$deploy_dir/"

      - name: Installer les dépendances et redémarrer Node.js
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail
          deploy_dir="/home/$CPANEL_USER/patricialanctot-app"
          ssh -i ~/.ssh/cpanel_deploy_key -p "${CPANEL_SSH_PORT:-22}" -o IdentitiesOnly=yes -o "HostKeyAlias=$CPANEL_HOST_KEY_ALIAS" "$CPANEL_USER@$CPANEL_HOST" \
            "source /home/$CPANEL_USER/nodevenv/patricialanctot-app/22/bin/activate && cd '$deploy_dir' && npm ci --omit=dev && mkdir -p tmp && touch tmp/restart.txt"

      - name: Résumé
        if: steps.config.outputs.ready == 'true'
        run: echo "Le code a été synchronisé; les variables d’environnement et la base de données du serveur ont été conservées." >> "$GITHUB_STEP_SUMMARY"
